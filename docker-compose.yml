# Stack Portainer / Compose — Facturación EcuNexo
# Path recomendado en Portainer (Git): docker-compose.yml (raíz del repo)
#
# Variables: sección Env de Portainer (ver deploy/portainer/.env.example)
#
# BD propia: Postgres del servicio `postgres` (Database=billing).
# No compartir la BD del stack Cliente. Integración con Cliente = solo HTTP
# (SPA → Billing.Api; Billing → Cliente API para egreso inventario).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    networks:
      - billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-billing}"]
      interval: 10s
      timeout: 5s
      retries: 10

  billing-api:
    # Solo build desde Dockerfile. Sin `image:` para que Portainer "Pull" no busque en Docker Hub.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BILLING_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      # Orígenes SPA Cliente (coma-separados). Localhost Vite ya van en código.
      Cors__AllowedOrigins: ${CORS_ORIGINS:-}
      # Default = Postgres del stack. BILLING_CONNECTION_STRING solo para override raro.
      ConnectionStrings__Default: ${BILLING_CONNECTION_STRING:-Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-billing};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      Billing__DatabaseBootstrap__Enabled: ${BILLING_BOOTSTRAP_ENABLED:-true}
      Billing__DatabaseBootstrap__Migrate: ${BILLING_BOOTSTRAP_MIGRATE:-true}
      Billing__DatabaseBootstrap__SeedCatalogs: ${BILLING_BOOTSTRAP_SEED:-true}
      Sri__UseInMemoryGateway: ${SRI_USE_INMEMORY:-true}
      Sri__DefaultEnvironment: ${SRI_ENVIRONMENT:-Test}
      Infisical__BaseUrl: ${INFISICAL_BASE_URL:-}
      Infisical__WorkspaceId: ${INFISICAL_WORKSPACE_ID:-}
      Infisical__Environment: ${INFISICAL_ENVIRONMENT:-dev}
      Infisical__SecretPath: ${INFISICAL_SECRET_PATH:-/}
      Infisical__ClientId: ${INFISICAL_CLIENT_ID:-}
      Infisical__ClientSecret: ${INFISICAL_CLIENT_SECRET:-}
      Infisical__CertificateSecretName: ${INFISICAL_CERT_SECRET_NAME:-keyfacturacion}
      Infisical__PasswordSecretName: ${INFISICAL_PASS_SECRET_NAME:-passfacturacion}
      RideProvider__Ruc: ${RIDE_PROVIDER_RUC:-}
      RideProvider__LegalName: ${RIDE_PROVIDER_LEGAL_NAME:-EcuNexo}
      RideProvider__FooterLine: ${RIDE_PROVIDER_FOOTER:-Documento generado por EcuNexo}
      InventoryEgress__Enabled: ${INVENTORY_EGRESS_ENABLED:-false}
      InventoryEgress__BaseUrl: ${INVENTORY_EGRESS_BASE_URL:-}
      InventoryEgress__ApiKey: ${INVENTORY_EGRESS_API_KEY:-}
    volumes:
      - billing_ride_data:/data
    networks:
      - billing

volumes:
  billing_pgdata:
  billing_ride_data:

networks:
  billing:
    driver: bridge
